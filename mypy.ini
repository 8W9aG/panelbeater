[mypy]
# Third-party packages below ship neither type stubs nor a py.typed marker,
# and no stub package is published for them. Listed per-module (rather than
# a blanket ignore_missing_imports) so anything that starts shipping types
# is type-checked again automatically.

[mypy-joblib.*]
ignore_missing_imports = True

[mypy-plotly.*]
ignore_missing_imports = True

[mypy-statsmodels.*]
ignore_missing_imports = True

[mypy-wavetrainer.*]
ignore_missing_imports = True

[mypy-yfinance.*]
ignore_missing_imports = True
